name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Compile backend
        run: .venv/bin/python -m compileall api.py backend tests

      - name: Run tests
        run: .venv/bin/python -m unittest discover -s tests -v
