[project]
name = "sehas-api"
version = "1.0.0"
description = "Smart Emergency Health Alert System — FastAPI Server"
requires-python = ">=3.11, <3.13"

dependencies = [
    "tensorflow>=2.16.2",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "joblib>=1.3.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0.0",
    "supabase>=2.4.0",
    "python-dotenv>=1.0.0",
    "firebase-admin>=6.5.0",
    "psycopg2>=2.9.0",
    "passlib>=1.7.4",
    "bcrypt>=5.0.0",
    "pyjwt>=2.12.1",
    "python-multipart>=0.0.22",
]

[tool.uv]
managed = true
