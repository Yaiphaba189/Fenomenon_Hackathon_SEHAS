[project]
name = "sehas-lstm"
version = "1.0.0"
description = "Smart Emergency Health Alert System — LSTM Anomaly Detection"
requires-python = ">=3.11, <3.13"

dependencies = [
    "tensorflow>=2.16.2",
    "scikit-learn>=1.4.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "joblib>=1.3.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0.0",
]

[tool.uv]
managed = true
